<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Living Corporation</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#1b2233;--sf:#2b374d;--tx:#e8ecf5;--mu:#9aa7c0;--bd:#4a5878;--ac:#e6c477;--ok:#8fd19e;--no:#f0968c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Pixelify Sans",ui-monospace,Menlo,monospace;padding-bottom:64px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#38465f;border-bottom:3px solid var(--bd);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
header b{font-size:16px;color:var(--ac);text-transform:uppercase}.st{color:var(--mu);font-size:13px;flex:1}
main{padding:12px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#38465f;border-top:3px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:600}
.c{background:var(--sf);border:3px solid var(--bd);box-shadow:4px 4px 0 #0e131c;padding:10px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{border:3px solid #8a6a3a;background:#e6c477;color:#1b2233;padding:4px 10px;margin:2px 5px 5px 0;box-shadow:3px 3px 0 #0e131c}.b.g{background:#93d3a2;border-color:#4c8a5c;color:#12301b}.b.r{background:#e8978e;border-color:#9a4a42;color:#3a0f0b}
input,select,textarea{background:var(--bg);border:3px solid var(--bd);padding:7px;width:100%;margin:3px 0}
.m{color:var(--mu);font-size:13px}.tag{display:inline-block;font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.msg{padding:7px 10px;border-radius:12px;margin:4px 0;max-width:85%;white-space:pre-wrap}.me{background:var(--ac);color:#1b2233;margin-left:auto}.th{background:var(--bg);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chips .b{white-space:nowrap}
h3{margin:14px 0 8px;font-size:15px;color:var(--ac);text-transform:uppercase;letter-spacing:1px}canvas{width:100%;image-rendering:pixelated;border:2px solid var(--bd);border-radius:6px;display:block;background:#000;touch-action:manipulation}pre{white-space:pre-wrap;font:13px/1.4 inherit;margin:4px 0}
</style></head><body>
<header><b>Founder HQ</b><span class="st" id="st"></span><button class="b p" onclick="nextDay()">Next day ▶</button><button class="b" onclick="hireSec()">+ Secretaries</button><button class="b" onclick="addFunds()">+ Funds</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),fmt=n=>Math.round(n).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEPTS=['Executive','HR','Engineering','Marketing','Finance','R&D'];
const ROLES={Executive:['CEO','COO'],HR:['HR Manager','HR Specialist'],Engineering:['Engineering Lead','Software Developer'],Marketing:['Marketing Manager','Marketing Specialist'],Finance:['Finance Director','Accountant'],'R&D':['Research Lead','Researcher']};
const FN='Amelia Ben Chloe Dev Elena Farid Grace Hiro Isla Jonas Kemal Lena Marco Nadia Omar Priya Quinn Rosa Sam Tara Umar Vera Wei Zoe'.split(' '),LN='Adams Brooks Chen Diaz Evans Fischer Gupta Hassan Ito Jensen Khan Lopez Moreau Novak Okafor Patel Reyes Silva Tanaka Walker'.split(' ');
const PERS=['confident and direct','shy and hesitant','ambitious and political','warm and loyal','cynical but competent','perfectionist and anxious','laid-back and creative'];
const LV={owner:'Owner-only',approval:'Owner approval',exec:'CEO decides (you stay out)',mgr:'Dept manager decides',auto:'Auto (routine)'};
const PT={hire:'Hire employee',raise:'Salary increase',promote:'Promotion',dismiss:'Dismissal',purchase:'Equipment purchase',project:'New project',budget:'Budget change',branch:'New branch',expand:'Industry expansion',contract:'Major contract',invest:'Major investment',leave:'Leave request',resign:'Resignation',ext:'Deadline extension',recruit:'Recruitment request'};
const PERM0={hire:'exec',raise:'mgr',promote:'exec',dismiss:'exec',purchase:'mgr',project:'exec',budget:'exec',branch:'owner',expand:'owner',contract:'owner',invest:'owner',leave:'mgr',ext:'mgr',recruit:'mgr',resign:'exec'};
let S,tab='office',sel=null,chatKey=null,q='',busy=false;
let dbDoc=null,svT=0;const save=()=>{try{localStorage.setItem('corp2',JSON.stringify(S))}catch(e){}if(dbDoc&&!svT)svT=setTimeout(()=>{svT=0;try{dbDoc.set({s:JSON.stringify(S),t:Date.now()}).catch(()=>{})}catch(e){}},1500)};
function person(d,r,l){const b=[4000,5500,8000,14000][l];return{id:'e'+S.nid++,name:R(FN)+' '+R(LN),dept:d,role:r,lvl:l,pers:R(PERS),mood:rnd(55,85),sat:rnd(55,85),prod:rnd(50,90),tech:rnd(45,90),comm:rnd(35,90),att:rnd(88,100),pun:rnd(80,100),exp:rnd(1,15),salary:b+rnd(0,1500),since:S.day,perf:[],warn:0,leave:0}}
function cand(d){const t=rnd(30,95),c=rnd(25,95);return{id:'c'+S.nid++,name:R(FN)+' '+R(LN),dept:d,role:R(ROLES[d]),edu:R(['BSc','MSc','PhD','Diploma','Self-taught']),exp:rnd(0,14),tech:t,comm:c,pot:rnd(30,98),sal:3500+t*50+rnd(0,2500),pers:R(PERS),amb:R(['wants to lead','wants stability','wants to learn','wants high pay']),pref:R(['remote','on-site','flexible hours']),status:'market',note:''}}
const fit=c=>Math.round(Math.min(100,c.tech*.45+c.comm*.2+Math.min(c.exp*2,20)+c.pot*.15));
function init(){S={day:1,cash:500000,inc:0,limit:2000,nid:1,emps:[],cands:[],reqs:[],tasks:[],hist:[],notes:[],chats:{},mem:{},unread:{},recruit:[],perm:{...PERM0}};
[['Executive','CEO',3],['HR','HR Manager',2],['HR','HR Specialist',1],['Engineering','Engineering Lead',2],['Engineering','Software Developer',1],['Engineering','Software Developer',1],['Marketing','Marketing Manager',2],['Marketing','Marketing Specialist',1],['Finance','Finance Director',2],['Finance','Accountant',1],['R&D','Research Lead',2],['R&D','Researcher',1]].forEach(s=>S.emps.push(person(...s)));
for(let i=0;i<10;i++)S.cands.push(cand(R(DEPTS.slice(1))));note('Welcome, founder. Your staff will come to you with requests and ideas.')}
const note=t=>{S.notes.unshift({d:S.day,t})};const emp=id=>S.emps.find(e=>e.id===id);
const mgr=d=>S.emps.filter(e=>e.dept===d).sort((a,b)=>b.lvl-a.lvl)[0];
const hlog=t=>S.hist.unshift({d:S.day,t});
function addMsg(key,f,t){if(f==='them'&&AG[key]){AG[key].say=String(t).slice(0,34);AG[key].sayT=320}(S.chats[key]=S.chats[key]||[]).push({f,t,d:S.day});if(f==='them'&&!(tab==='chat'&&chatKey===key))S.unread[key]=(S.unread[key]||0)+1}
function remember(id,t){(S.mem[id]=S.mem[id]||[]).push('Day '+S.day+': '+t)}
async function llm(p){try{if(typeof claude==='undefined')return null;const sm=await claude.use('sample');if(!sm)return null;const r=await sm(p,{cache:false,modelTier:'quick'});return(r.text||'').trim()||null}catch(e){return null}}
function persona(e){const m=(S.mem[e.id]||[]).slice(-6).join('; ')||'none';return`You are ${e.name}, ${e.role} (${e.dept}) at a corporation owned by the player (the founder). Personality: ${e.pers}. Mood ${e.mood}/100, job satisfaction ${e.sat}/100, ${e.exp} yrs experience. Memories: ${m}. Company facts: cash $${fmt(S.cash)}, ${S.emps.length} staff, day ${S.day}. Stay in character, 1-3 sentences, address the owner respectfully (more formal if junior). Never claim anything was approved or completed unless stated in memories.`}
async function say(e,ev,key){key=key||e.id;const fb={cynical:'Understood. I’ll make do.',shy:'Oh… okay, sir. Thank you for letting me know.'}[e.pers.split(' ')[0]]||'Understood, sir. I’ll adjust accordingly.';let t=await llm(persona(e)+`\nEvent: ${ev}\nWrite your short reaction/message to the owner.`)||fb;addMsg(key,'them',t);save();if(tab==='chat'||tab==='inbox')render()}
/* authorization engine */
function request(type,e,text,data){const r={id:'r'+S.nid++,type,by:e.id,text,data:data||{},status:'Pending',d:S.day,rev:0};const l=S.perm[type];S.reqs.unshift(r);
if(l==='auto'||(l==='mgr'&&e.lvl>=2)||(l==='exec'&&e.lvl>=3)){r.status='Approved';r.auto=true;hlog(`${PT[type]} by ${e.name} auto-authorised (${LV[l]}): ${text}`);run(r)}else{const dm=l==='exec'?S.emps.filter(x=>x.lvl>=3).sort((a,b)=>b.salary-a.salary)[0]:l==='mgr'?mgr(e.dept):null;if(!(dm&&dm.id!==e.id&&delegDecide(r,dm,e)))note(`${e.name} requests: ${PT[type]}`)}return r}
function run(r){const e=emp(r.by),d=r.data;
if(r.type==='hire'){const c=S.cands.find(x=>x.id===d.cid),rc=S.recruit.find(x=>x.id===c.rid);if(rc&&rc.hired>=rc.n){r.status='Cancelled';return}c.status='hired';const n=person(c.dept,c.role,0);Object.assign(n,{name:c.name,tech:c.tech,comm:c.comm,exp:c.exp,pers:c.pers,salary:d.sal,mood:80,sat:75});S.emps.push(n);if(rc){rc.hired++;if(rc.hired>=rc.n)rc.status='filled'}note(`${n.name} joined as ${n.role}. Onboarding complete.`);addMsg(n.id,'them','Good morning, sir. Thank you for the opportunity. I’m ready to start.')}
else if(r.type==='raise'){e.salary+=d.amt;e.sat=Math.min(100,e.sat+15)}
else if(r.type==='promote'){e.lvl=Math.min(3,e.lvl+1);e.role=(e.lvl>=2?'Senior ':'')+e.role.replace('Senior ','');e.salary=Math.round(e.salary*1.15);e.sat=Math.min(100,e.sat+20)}
else if(r.type==='dismiss'){S.emps=S.emps.filter(x=>x.id!==e.id);S.tasks.forEach(t=>{if(t.who===e.id&&!['Completed','Cancelled','Rejected'].includes(t.status))t.who=(mgr(e.dept)||{}).id})}
else if(r.type==='resign'){S.emps=S.emps.filter(x=>x.id!==e.id);note(e.name+' left the company.')}else if(r.type==='leave'){e.leave=d.days||2}
else if(r.type==='ext'){const t=S.tasks.find(x=>x.id===d.tid);if(t)t.due+=5}
else if(r.type==='project'){S.cash-=d.cost;S.tasks.push(task('Project: '+r.text,e.id,6,0,'In Progress'))}
else if(['purchase','budget'].includes(r.type)){S.cash-=d.cost;e.prod=Math.min(100,e.prod+3)}
else if(['branch','expand','contract','invest'].includes(r.type)){S.cash-=d.cost;S.inc+=d.cost*.004}
else if(r.type==='recruit'){S.recruit.push({id:'q'+S.nid++,dept:d.dept,n:d.n,by:e.id,status:'open',hired:0,d:S.day})}
if(d.tid&&r.type==='budget'){const t=S.tasks.find(x=>x.id===d.tid);if(t){t.status='In Progress';t.log.push('Budget approved')}}}
function decide(id,act){const r=S.reqs.find(x=>x.id===id),e=emp(r.by)||{id:r.by,name:'HR'};let key=r.by;
if(act==='ask'){chatKey=r.by;tab='chat';return render(`About your request (${PT[r.type]}): `)}
if(act==='deleg'){S.perm[r.type]='exec';hlog('Owner delegated '+PT[r.type]+' to executives');return render()}
if(act==='mod'){const m=prompt('Your modification / instruction (include a new number to change the amount):');if(!m)return;const n=(m.match(/\d[\d,]*/)||[])[0];if(n){const v=+n.replace(/,/g,'');if(r.data.amt!=null)r.data.amt=v;else if(r.data.sal!=null)r.data.sal=v;else if(r.data.cost!=null)r.data.cost=v}r.rev++;r.text+=` [Revised per owner: ${m}]`;hlog(`Owner requested modification of ${PT[r.type]}: ${m}`);remember(r.by,'Owner asked me to modify my request: '+m);say(emp(r.by)||e,`Owner asked you to modify your ${PT[r.type]} request: "${m}". Acknowledge and say you've revised it.`);return render()}
if(act==='ok'){r.status='Approved';run(r);hlog(`Owner APPROVED ${PT[r.type]}: ${r.text}`);if(emp(r.by)){remember(r.by,'Owner approved my '+PT[r.type]);say(emp(r.by),`Owner approved your ${PT[r.type]} request (${r.text}). React.`)}}
else{r.status='Rejected';hlog(`Owner REJECTED ${PT[r.type]}: ${r.text}`);if(r.data.cid){const c=S.cands.find(x=>x.id===r.data.cid);c.status='rejected'}if(emp(r.by)){const x=emp(r.by);x.sat=Math.max(0,x.sat+(r.type==='resign'?8:-8));remember(r.by,'Owner rejected my '+PT[r.type]);say(x,`Owner rejected your ${PT[r.type]} request (${r.text}). React naturally and say how you will adjust.`)}}
save();render()}
/* tasks */
function task(text,who,diff,cost,status){return{id:'t'+S.nid++,text,who,diff,cost,status:status||'Pending',prog:0,d:S.day,due:S.day+Math.ceil(diff*1.6)+3,log:[],report:''}}
function assign(){const t=$('#tt').value.trim(),a=$('#ta').value;if(!t)return;const who=a.startsWith('D:')?(mgr(a.slice(2))||{}).id:a,w=emp(who);if(!w)return;const cost=/expan/i.test(t)?50000:/\bAI\b|software/i.test(t)&&/develop|build/i.test(t)?30000:/campaign/i.test(t)?12000:/equipment|purchase|buy/i.test(t)?8000:/recruit|hire/i.test(t)?2500:0;const k=task(t,who,Math.min(6,2+Math.ceil(t.length/40)),cost);k.dept=a.startsWith('D:')?a.slice(2):w.dept;S.tasks.unshift(k);
if(t.split(/\s+/).length<4){k.log.push('Asked owner for clarification');addMsg(who,'them','Sir, I received your instruction but I need more detail on scope and expected outcome before I begin. Could you elaborate?');k.status='Pending'}
else if(cost>S.limit){k.status='Awaiting Approval';request('budget',w,'Budget $'+fmt(cost)+' for task: '+t,{cost,tid:k.id});if(k.status==='Awaiting Approval'&&S.reqs[0].status==='Approved')k.status='In Progress'}
else{k.status='In Progress';k.prog=20;k.log.push('Accepted by '+w.name)}
remember(who,'Owner assigned me: '+t);addMsg(who,'them',k.status==='Pending'?'Sir, I need clarification first.':'Understood, sir. I’ll get started and report progress.');save();render()}
function report(t,w){const a=Math.round(S.emps.reduce((s,e)=>s+e.prod,0)/S.emps.length),rev=S.emps.reduce((s,e)=>s+e.prod*8,0)+S.inc,pay=S.emps.reduce((s,e)=>s+e.salary/30,0);return`Report by ${w.name} (${w.role}), day ${S.day}\nTask: ${t.text}\nData: cash $${fmt(S.cash)}, headcount ${S.emps.length}, avg productivity ${a}%, revenue/day $${fmt(rev)}, payroll/day $${fmt(pay)}, margin ${Math.round((rev-pay)/rev*100)}%.\nLowest morale: ${S.emps.slice().sort((x,y)=>x.sat-y.sat).slice(0,2).map(e=>e.name+' ('+e.sat+')').join(', ')}.\nRecommendation: ${rev-pay<2000?'cut spending and review underperformers':'reinvest part of the margin in hiring and R&D'}.`}
function review(id,act){const t=S.tasks.find(x=>x.id===id),w=emp(t.who);
if(act==='ok'){t.status='Completed';const n={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};const m=t.text.match(/\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b/i);
if(t.dept==='HR'&&/recruit|hire/i.test(t.text)){const k=m?(+m[1]||n[m[1].toLowerCase()]):2,d=/market/i.test(t.text)?'Marketing':/financ|account/i.test(t.text)?'Finance':/research/i.test(t.text)?'R&D':'Engineering';S.recruit.push({id:'q'+S.nid++,dept:d,n:k,by:w.id,status:'open',hired:0,d:S.day});t.log.push(`Opened recruitment for ${k} ${d} hires`)}else{S.inc+=t.diff*15;t.log.push('Effect applied: +$'+t.diff*15+'/day revenue')}
w.sat=Math.min(100,w.sat+4);w.perf.push({d:S.day,s:Math.min(100,70+rnd(0,25)),n:'Delivered: '+t.text.slice(0,40)});remember(w.id,'Owner accepted my work: '+t.text.slice(0,50))}
else if(act==='back'){const m=prompt('Additional instructions:');if(!m)return;t.status='In Progress';t.prog=60;t.log.push('Owner: '+m);remember(w.id,'Owner sent my work back: '+m);say(w,`Owner sent your finished work back with: "${m}". React.`)}
else if(act==='rej'){t.status='Rejected';w.sat-=5}else if(act==='can'){t.status='Cancelled'}
hlog(`Task "${t.text.slice(0,40)}": ${t.status}`);save();render()}
/* simulation */
async function nextDay(){if(busy)return;busy=true;S.day++;const E=S.emps;
const rev=E.reduce((s,e)=>s+(e.leave?0:e.prod*8*(e.mood/100+.3)),0)+S.inc;S.cash+=rev-E.reduce((s,e)=>s+e.salary/30,0);
E.forEach(e=>{if(e.leave>0)e.leave--;e.sat+=(60-e.sat)*.03;e.mood=Math.max(10,Math.min(100,e.mood+(e.sat-e.mood)*.15+rnd(-4,4)))});
for(const t of S.tasks.filter(x=>x.status==='In Progress')){const w=emp(t.who);if(!w){t.status='Cancelled';continue}if(w.leave)continue;t.prog=Math.min(100,t.prog+Math.round((w.prod+w.tech)/2/t.diff*1.2*(w.mood/80)));
if(t.prog>=100){t.status='Under Review';t.report=report(t,w);addMsg(w.id,'them','Sir, the work on “'+t.text.slice(0,50)+'” is ready for your review. The report is attached to the task.');note(w.name+' submitted work for review');const p=await llm(persona(w)+'\nFacts:\n'+t.report+'\nAdd a 2-sentence executive summary of this report, using only these facts.');if(p)t.report+='\nSummary: '+p}
else if(S.day>t.due&&!S.reqs.some(r=>r.data.tid===t.id&&r.status==='Pending')){t.due=S.day+99;request('ext',w,`Cannot meet deadline for "${t.text.slice(0,40)}" (${t.prog}% done); need 5 more days.`,{tid:t.id});addMsg(w.id,'them','Sir, I have to be honest: we won’t make the deadline. I’ve filed an extension request.')}}
S.tasks.filter(t=>t.status==='Under Review').forEach(t=>{t.rv=(t.rv||0)+1;if(t.rv>=3){note('Manager auto-accepted: '+t.text.slice(0,40));review(t.id,'ok')}});
/* HR */
const hr=S.recruit.filter(x=>x.status==='open'),H=mgr('HR');for(const rc of hr){const pool=()=>S.cands.filter(c=>c.dept===rc.dept&&c.status==='market');while(pool().length<5)S.cands.push(cand(rc.dept));
pool().sort((a,b)=>fit(b)-fit(a)).slice(0,3).forEach(c=>{c.status='shortlist';c.rid=rc.id;c.note=`HR interview: technical ${c.tech>70?'strong':'average'}, communication ${c.comm>65?'good':'weak'}, potential ${c.pot}. ${c.amb}; prefers ${c.pref}.`;request('hire',H,`Hire ${c.name} as ${c.role} (fit ${fit(c)}/100, asks $${fmt(c.sal)}/mo)`,{cid:c.id,sal:c.sal})});rc.status='shortlisted'}
/* manager shortage detection */
E.filter(e=>e.lvl===2&&e.dept!=='HR').forEach(m=>{const load=S.tasks.filter(t=>t.status==='In Progress'&&emp(t.who)&&emp(t.who).dept===m.dept).length;if(load>=3&&!S.recruit.some(r=>r.dept===m.dept&&r.status!=='filled')&&Math.random()<.5){addMsg(m.id,'them','Sir, my team is struggling to meet deadlines. I’ve asked HR for another hire.');request('recruit',m,'Staffing shortage in '+m.dept,{dept:m.dept,n:1})}});
/* initiations */
let n=0;for(const e of E.sort(()=>Math.random()-.5)){if(n>=2||e.leave)continue;const p=.05*(e.pers.startsWith('shy')?.5:e.pers.startsWith('conf')||e.pers.startsWith('amb')?1.6:1);if(Math.random()>p)continue;n++;await initiate(e)}
/* evaluations & resignations */
if(S.day%7===0)E.forEach(e=>{if(e.lvl>=3||e.dept==='Executive'&&e.lvl>=3)return;const s=Math.round((e.prod+e.tech+e.att+e.pun)/4+rnd(-8,8));e.perf.push({d:S.day,s,n:s>80?'Exceptional':s<55?'Poor':'Meets expectations'});const m=mgr(e.dept);if(s<55){e.warn++;note(`${(m||e).name} issued a warning to ${e.name}`);addMsg(e.id,'them','Sir, I received a warning in my evaluation. I think it doesn’t reflect the circumstances — may I explain?')}else if(s>85&&e.lvl<3&&Math.random()<.5&&!S.reqs.some(r=>r.by===e.id&&r.type==='promote'&&r.status==='Pending'))request('promote',m||e,`Recommend promoting ${e.name} (score ${s}).`,{})});
life();E.filter(e=>e.sat<20).forEach(e=>{S.emps=S.emps.filter(x=>x!==e);note(e.name+' resigned.');hlog(e.name+' resigned (job satisfaction too low)')});
save();busy=false;render()}
async function initiate(e){const bad=e.sat<55,topics=[];if(bad||e.pers.startsWith('amb'))topics.push('raise');if(e.tech>65)topics.push('project');topics.push('purchase','leave','idea','complaint','personal','guidance');if(S.day-e.since>10&&e.perf.some(p=>p.s>80)&&e.lvl<3)topics.push('promote');const t=R(topics),o={
raise:()=>{const a=Math.round(e.salary*rnd(8,15)/100);request('raise',e,`Asks for a raise of $${fmt(a)}/mo (to $${fmt(e.salary+a)}).`,{amt:a});return'Sir, may I discuss something regarding my salary? I’d like to ask for a raise.'},
